<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退休金試算</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- 引入 LIFF SDK (選擇性) -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
    <div class="glass-container">
        <div class="header">
            <h1>財富規劃</h1>
            <p>探索您的退休金準備，為未來規劃</p>
        </div>

        <form id="calc-form">
            <div class="input-group">
                <label for="current_age">目前年齡</label>
                <input type="number" id="current_age" name="current_age" placeholder="例如: 30" required min="1" max="99">
            </div>

            <div class="input-group">
                <label for="retire_age">預計退休年齡</label>
                <input type="number" id="retire_age" name="retire_age" placeholder="例如: 65" required min="1" max="99">
            </div>

            <div class="input-group">
                <label for="monthly_expense">退休後每月花費 (NT$)</label>
                <input type="number" id="monthly_expense" name="monthly_expense" placeholder="例如: 50000" required
                    min="0">
            </div>

            <div class="input-group">
                <label for="monthly_saving">每月可存款金額 (NT$)</label>
                <input type="number" id="monthly_saving" name="monthly_saving" placeholder="例如: 20000" required min="0">
            </div>

            <div class="input-group">
                <label for="current_saving">目前總存款 (NT$)</label>
                <input type="number" id="current_saving" name="current_saving" placeholder="例如: 1000000" required
                    min="0">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span>開始試算</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div id="result-container" class="result-container hidden">
            <h2>試算結果</h2>
            <div class="result-card">
                <p class="label">退休總需求</p>
                <h3 id="res-need">NT$ 0</h3>
            </div>
            <div class="result-card">
                <p class="label">預估實際存款</p>
                <h3 id="res-fund">NT$ 0</h3>
            </div>
            <div class="result-card highlight">
                <p class="label">資金缺口</p>
                <h3 id="res-gap">NT$ 0</h3>
            </div>

            <div class="chart-container" style="position: relative; height:300px; width:100%; margin-top:20px;">
                <canvas id="resultChart"></canvas>
            </div>

            <button class="close-btn" id="close-btn">關閉並回傳 LINE</button>
        </div>
    </div>

    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>

</html>
